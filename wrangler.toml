name = "gamify-api"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "gamify-prod-db"
database_id = "05381ba1-cc11-468f-9859-54447cdc446f"
migrations_dir = "./"

# Cloudflare Workers Static Assets (Serves frontend static bundle from ./dist)
[assets]
directory = "./dist"
binding = "ASSETS"
